# Code generated by forge. DO NOT EDIT.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # A pull request that touches only prose skips this workflow: nothing here
    # reads docs/ or the root *.md files under -short. Skills ARE embedded in
    # the binary, so a skills-only change is not unchecked — docs-skills.yml
    # runs the packages that read them (and docs/). A path filter that skips a
    # whole workflow leaves any REQUIRED check it owns pending forever; none
    # is required today (the main ruleset has no status-check rule). If one
    # becomes required, require `CI gate` from a workflow that always runs, or
    # move this filter into a job-level `if:`.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "internal/templates/project/skills/**"
  # Run the push-to-main tier (full mode, -race, Windows) on any branch.
  workflow_dispatch:

permissions:
  contents: read

# ── TWO TIERS ──────────────────────────────────────────────────────────────
#
# A PULL REQUEST gets the fast tier, budgeted at about five minutes of wall
# time with no job longer than ~4-5 minutes including setup:
#
#   test-short        the -short tier, no -race, sharded (scripts/ci-test-shard.sh)
#   flake-gate        tests the change adds or edits, -race -count=3
#   windows-cross     GOOS=windows build + vet, from Linux
#   lint              golangci-lint (root and pkg/), go vet, go vet -tags e2e
#   verify-generated  forge generate is a no-op, KCL validates
#   quick-checks      pre-commit hooks, Go and npm dependency licenses, govulncheck
#
# A PUSH TO MAIN (and workflow_dispatch) gets everything the pull request got
# except the sharded and flake lanes, plus the slow tier:
#
#   test, test-cli    full mode (no -short) under -race
#   test-short-warm   the whole -short tier, then the guards (full mode, -p 1);
#                     saves the build cache the pull-request shards restore
#   build             the -trimpath release build, then go-licenses
#   windows           native Windows: build, vet, -short tests, smoke
#
# FEWER, LARGER JOBS. The org runs at most 20 jobs at once across every
# repository, and on 2026-10-20 a quarter of all minutes had every slot busy:
# a pull request's jobs QUEUED a median 7 minutes (p90 23) to run for 2-3.
# Each job also pays ~45-60s of setup. So checks that share a toolchain share
# a job: the pre-commit, license-gate and Library Lint workflows (four more
# jobs per pull request, three per push) live here now, the e2e vet joined
# lint, vuln-scan joined quick-checks, the guards
# joined the whole -short tier and go-licenses joined build (no race, no -short
# difference in what they compile). A pull request runs 8 jobs, down from 13.
#
# plus e2e-suite.yml and e2e-scaffold.yml (which also run nightly). Speed on
# the pull request was chosen over catching everything before merge: a test
# that needs more than ~2s skips under -short (`if testing.Short()`) and runs
# on main, and a red main is bisected from there. Nothing was deleted — every
# check that left the pull request runs on every push to main.
#
# `gate` (CI gate) needs every job, fails if any failed, and writes each
# job's wall time and the run's critical path to the run summary.

# Cancel a superseded run on a pull request only. On main the run in progress
# always finishes: every push to main shares one group, so cancelling there let
# each merge kill the run before it — usually while its jobs were still queued
# for a runner. control-plane lost every main run for 2.5 hours that way on
# 2026-10-11 (control-plane#831). GitHub keeps at most one PENDING run per
# group and a newer push replaces it, so a burst of merges costs one extra
# run, not one per merge. Every workflow here follows the same rule, and
# internal/templates/ci_concurrency_test.go holds them to it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Go version is read from go.mod's `go` directive via setup-go's
# `go-version-file` input so CI stays in sync with the project's declared
# version without a duplicate env var that drifts.
#
# Build-cache note (the "Restore Go build cache" steps below).
#
# setup-go's own `cache: true` DOES cache the build cache — it saves
# `go env GOCACHE` alongside `go env GOMODCACHE`. What it does not do is
# give that cache any RESTORE-KEYS: cache-restore.ts calls
# restoreCache(paths, primaryKey) with no fallback list, and the primary
# key ends in a hash of go.sum. So the hit is all-or-nothing — touch a
# single dependency and the restore misses, and the job recompiles the
# world from cold rather than reusing the ~99% of build artifacts that
# did not change.
#
# A go.sum change is not the rare case here: Dependabot bumps it
# continuously, and that is exactly the PR where a cold compile is least
# affordable. The steps below add a second, keyed
# cache over the same GOCACHE directory with a restore-key ladder, so a
# go.sum change degrades to "reuse the previous commit's build cache"
# instead of "start from nothing".
#
# Keys are ordered most- to least-specific:
#   …-<go.sum hash>-<sha>  exact commit (a re-run reuses everything)
#   …-<go.sum hash>-       same deps, different code
#   …-                     same Go version, any deps  ← the Dependabot case
#
# GOCACHE is content-addressed and self-validating: every entry is keyed
# by the hash of its own inputs, so a stale entry is ignored rather than
# mis-used. That is what makes a loose restore-key safe here — the worst
# case of an old cache is a miss on the changed packages, never a wrong
# object.
#
# PULL REQUESTS RESTORE; ONLY MAIN SAVES. Each laddered cache is a
# `actions/cache/restore` step at the top of its job and an
# `actions/cache/save` step at the bottom that runs only on a push to main.
# A cache a pull request saves is scoped to that PR's ref: no other PR, and
# not main, can restore it. All it bought was a warm re-run of the same PR,
# and it cost everyone else their hits. The repository's cache budget is
# 10 GB, and with every PR job saving its own entry (the Windows job alone
# saved ~3.8 GB per run) the budget held about an hour of entries: on
# 2026-10-15 there was no main entry left for test-guards, windows or the
# tools scope, and the Test job ran 1045-1302s on a miss against 529s on a
# hit. Saving after the job's real work (not in a post step) also means a
# red main still saves what it compiled: `!cancelled()`, not `success()`.

jobs:
  # One job for every static check that needs the linux build: golangci-lint
  # over the root module, again over pkg/ under pkg/.golangci.yml (formerly
  # the Library Lint workflow; see the step), `go vet ./...`
  # (the pre-commit config's go-vet-mod hook, which quick-checks skips) and
  # `go vet -tags e2e` (formerly the e2e-compile job). They share one build
  # cache scope.
  lint:
    name: Lint (golangci-lint, go vet, -tags e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint type-checks the whole repo, which is a full compile
      # in all but name. Its own action caches the analyzer results; this
      # caches the Go build artifacts underneath them.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          # The -short scope is the fallback: the same non-race linux
          # compile `go vet` needs.
          restore-keys: |
            go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-lint-${{ runner.os }}-
            go-build-short-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and kept equal to templates.GolangciLintVersion by
          # TestGolangciLintVersionIsPinnedEverywhere. `latest` let v2.14.0
          # add seven findings on untouched lines with no commit in between.
          version: v2.14.0
          # No --timeout: it would override .golangci.yml's `timeout: 20m`,
          # which is deliberate — a cold cache on a busy runner crosses 5m and
          # exits 4 ("Timeout exceeded") with 0 issues, a red PR over clean code.
          # Whole-repo, not only-new-issues. The job analyses the whole repo
          # anyway (type-checking needs it); only-new-issues only HIDES what it
          # found outside the diff. That is how main stayed green while
          # failing its own linter, and the action cannot fetch a PR patch over
          # 20k lines, so large PRs silently fell back to whole-repo regardless.
          only-new-issues: false
      # Library lint: forge/pkg, the runtime library that compiles INTO every
      # generated binary, held to its own config, pkg/.golangci.yml.
      #
      # The root .golangci.yml excludes `(^|/)pkg/`, because the CLI's linter
      # set reports a backlog of findings there that is being paid down
      # separately (see that exclusion's comment). The library answers to
      # pkg/.golangci.yml instead, a narrow forbidigo gate against reading the
      # ambient environment. golangci-lint picks its config by walking up from
      # its working directory, so that config is only read by a run from pkg/,
      # which is what this step is. internal/pkgguard's
      # TestLibraryReadsNoAmbientEnvironment enforces the same rule in the test
      # jobs; this step is the only golangci-lint pass over pkg/ at all, and
      # TestLibraryLintIsGatedInCI pins that it exists.
      - name: golangci-lint (pkg/, under pkg/.golangci.yml)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned; see the step above and templates.GolangciLintVersion.
          version: v2.14.0
          # golangci-lint discovers pkg/.golangci.yml by walking up from its
          # working directory. Running from the repo root would pick the
          # root config, which excludes pkg/ entirely, and lint none of it.
          working-directory: pkg
          # No --timeout: pkg/.golangci.yml sets its own (20m).
          # NOT only-new-issues: the guardrail this library is held to is
          # whole-file, and a rule that only sees changed lines lets a
          # violation ride in on an untouched line of an edited file.
          only-new-issues: false
      # The pre-commit config's go-vet-mod hook, run here where the module is
      # already compiled; quick-checks runs the other hooks with it skipped.
      - name: go vet ./...
        if: ${{ !cancelled() }}
        run: go vet ./...
      # The e2e files compile. They are behind `//go:build e2e`, so
      # golangci-lint (configured with no build tags) and every plain `go test`
      # never see them; the suite that runs them (e2e-suite.yml) is
      # push-to-main and nightly. The cheapest and commonest breakage in a
      # tagged file is that it stopped compiling, so that much is checked on
      # every pull request: `go vet` type-checks the test files, which
      # `go build` does not reach. The package set is derived from the build
      # constraints, not typed here.
      - name: go vet -tags e2e
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # testdata/ is excluded: the go command never builds it, and a
          # fixture there (codemod's legacy project, #998) is a copy of
          # someone else's code, not a package of this module. Naming it
          # explicitly made `go vet` compile it ("undefined: freePort").
          mapfile -t pkgs < <(git grep -lE '^//go:build.*\be2e\b' -- '*.go' ':(exclude,glob)**/testdata/**' | xargs -n1 dirname | sort -u | sed 's|^|./|')
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::no file carries the e2e build tag — this check would inspect nothing"
            exit 1
          fi
          printf '%s\n' "${pkgs[@]}"
          go vet -tags e2e "${pkgs[@]}"
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # ── The pull-request test tier: -short, no -race, sharded ───────────────
  #
  # Each shard is one invocation of scripts/ci-test-shard.sh over
  # scripts/ci-test-packages.sh's `short I N`: every package, dealt
  # round-robin. internal/ciguard fails if this matrix misses an index.
  #
  # TWO SHARDS, because the cost is compile and link, not test bodies.
  # Measured on this PR's first runs: internal/cli's ~3,200 tests take 16-18s
  # per third on a runner and internal/generator's ~370 take ~6s, while a
  # shard's `go test` step is ~50-75s and setup ~45s. Splitting packages by
  # test name (tried first, 8 shards) bought nothing a package boundary does
  # not, and every extra job queues: the org runs at most 20 jobs at once.
  #
  # No -race: it multiplies compile and run time several-fold, and the
  # race-detected run of every package happens on each push to main (`test`,
  # `test-cli`). flake-gate keeps -race on the tests a change touches. No
  # -count=1: the -short tier is held cache-sound, so a package main's cache
  # already holds a result for replays it.
  test-short:
    name: Test (-short) ${{ matrix.shard }}
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports: one failure must not hide another shard's.
      fail-fast: false
      matrix:
        include:
          - { shard: "1/2", args: "0 2" }
          - { shard: "2/2", args: "1 2" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The -short tier's own scope, saved from main by test-short-warm. Its
      # first fallback is the tools scope: `go install ./cmd/forge` without
      # -race, i.e. most of what these shards compile, already compiled.
      - name: Restore Go build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-short-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-short-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-short-${{ runner.os }}-
            go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # The same toolchain as `test`: postgres for pkg/pgtest, buf for the
      # generate pipeline, migrate for TestDBReset_*. A test that needs a
      # missing tool fails under CI=true rather than skipping.
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Authenticated for the rate limit; see the same step in `test`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      - name: Go tests (-short)
        env:
          CI_TEST_JSON: ${{ runner.temp }}/test-shard.json
        run: scripts/ci-test-shard.sh ${{ matrix.args }}
      - name: Upload the go test -json stream
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-short-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-shard.json
          retention-days: 7
          if-no-files-found: warn

  # The flake gate: every test the pull request adds or edits, three times,
  # under -race (scripts/ci-changed-tests.sh says how it finds them and why).
  # A test that passes once and fails once is caught here, before it lands,
  # instead of in somebody else's pull request weeks later.
  flake-gate:
    name: Flake gate (new/edited tests, -race -count=3)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Depth 2: the merge commit and its first parent, the base branch's tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # -race artifacts: main's test-cli and test scopes hold them.
      - name: Restore Go build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-cli-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-test-cli-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-cli-${{ runner.os }}-
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      - name: New and edited tests, -race -count=3
        run: scripts/ci-changed-tests.sh HEAD^1

  # Windows, cross-checked from Linux on every pull request: the whole module
  # and its tests must still COMPILE for windows/amd64 (vet type-checks test
  # files). vet's verdict depends on the target, not the host. The
  # windows/arm64 build (~2 min more, cold) is in the native job and the
  # arm64 vet in nightly.yml: only GOARCH-specific files differ. The native Windows job — which RUNS the -short tier
  # and the scaffold + render smoke — is push-to-main only: at 17-19 minutes it
  # was the slowest job on every pull request, and the failures only it finds
  # (path separators, file locking, the KCL DLL load) are rare and cheap to
  # bisect from main.
  windows-cross:
    name: Windows (cross-compile + vet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-wincross-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-wincross-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-wincross-${{ runner.os }}-
      - name: Build (windows/amd64)
        run: go build ./...
      - name: Vet (windows/amd64, includes tests)
        run: go vet ./...
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # ── Go tests, full mode: three jobs, partitioned by scripts/ci-test-packages.sh ──
  #
  # PUSH TO MAIN ONLY (and workflow_dispatch). A pull request runs the -short
  # tier above instead; these are the slow tier that catches what -short
  # skips, plus the race detector over everything.
  #
  # `test` runs every package under -race EXCEPT internal/cli and the
  # repo-wide guards (internal/tierguard, internal/removalguard,
  # internal/deadcodeguard); `test-cli` runs internal/cli under -race;
  # `test-short-warm` runs the guards after the whole -short tier. Each on a
  # runner of its own. The script is
  # the single list and each job's first step proves the three sets partition
  # `go list ./...`, so a package can neither drop out of every job nor run in
  # two. `task test` runs the same three sets locally.
  #
  # WHY internal/cli ALONE. Under -race it took 665-692s of `test`'s
  # 1215-1253s `go test` step by itself, sharing four cores with every other
  # package. In a job of its own the two halves run side by side, and the
  # lane's wall time is the slower half (the script's header has the detail).
  #
  # WHY THE GUARDS. They are the two slowest packages by a wide margin (~980s and
  # ~700s under -race; the next is ~410s) and the two largest in memory.
  # Inside `go test -race ./...` they co-resided with every other test binary
  # on one 16 GB runner, and the job was OOM-killed about one run in three —
  # "The runner has received a shutdown signal", exit 143, no test failed.
  # A job boundary bounds that by construction; go test's package
  # scheduling only ever bounded it by luck. Measured numbers are in the PR
  # that introduced this split (#304).
  #
  # deadcodeguard joined them when its scan began type-checking the whole
  # program once per target OS (#469) and held all three loads at once:
  # ~23 GB RSS under -race, measured locally, and the Test job died on most
  # runs from #469 on. Its scan now holds one load at a time (~12.7 GB under
  # -race, ~5.4 GB without), and here it is bounded by the job boundary too.
  #
  # WHY NO -race FOR THE GUARDS. Their own code has no concurrency worth
  # detecting — removalguard is a regex scan over files, tierguard diffs
  # rendered trees, deadcodeguard walks syntax trees after a load — and the
  # render work happens in child processes. The production code those
  # renders exercise (generate, codegen, cli) is race-tested by its own
  # packages in `test`. -race cost them ~100x in removalguard (10s → ~980s),
  # ~5x in tierguard and ~4x in deadcodeguard. e2e-suite.yml omits -race for
  # the same reason.
  test:
    name: Test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # This job compiles far more than it looks: the suite scaffolds real
      # projects and runs real `go build` / `go mod tidy` inside them, and
      # it runs under -race, which is a separate set of build artifacts
      # from the non-race ones every other job produces. It is the job
      # that benefits most from a warm GOCACHE.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-${{ runner.os }}-
      # pkg/pgtest boots postgres for the DB-backed tests; see the action.
      - uses: ./.github/actions/embedded-postgres-cache
      # internal/tierguard renders real fixture projects, which drives the
      # generate pipeline's "buf generate (Go stubs)" step. Without buf on
      # PATH those guards fail with `exec: "buf": executable file not found`
      # — they deliberately fail rather than report an empty inventory as a
      # pass, so this is a hard dependency of the test job, not a nicety.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Without a token the action resolves buf's release through an
          # UNAUTHENTICATED api.github.com call, rate-limited to 60/hour
          # per runner IP and shared with every other job on that host.
          # Exhausted, the step dies with "API rate limit exceeded" and
          # the job fails for a reason that has nothing to do with the
          # commit. The built-in token lifts that to 1000/hour per
          # repository; contents: read is all a release lookup needs.
          # Same failure mode ci.yml already pins KCL_VERSION to avoid.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # TestDBReset_* shell out to the golang-migrate CLI and carry no e2e
      # tag. They live in internal/cli (test-cli installs it too); this job
      # keeps the install so no package here can lose a tool by moving.
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate

      - name: Check the test-job partition
        run: scripts/ci-test-packages.sh check
      - name: Go tests
        # -timeout is explicit rather than left to `go test`'s 10-minute
        # default. A panicking timeout fails the whole job and hides every
        # other package's result behind something that reads as a hang rather
        # than as one slow package. A generous explicit budget keeps a genuine
        # deadlock detectable while making the failure mode legible.
        run: go test -race -count=1 -timeout 30m $(scripts/ci-test-packages.sh unit)
      - name: Local registry maintenance integration
        run: go test -race -tags=integration -count=1 -timeout=5m ./internal/storage
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  test-cli:
    name: Test (internal/cli)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Its own scope: internal/cli's -race test binary and the projects its
      # tests scaffold and build. It falls back to `test`'s scope, which holds
      # the same -race artifacts for every package internal/cli imports.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-cli-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-test-cli-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-cli-${{ runner.os }}-
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # The same toolchain as `test`, for the same reasons: postgres for the
      # DB-backed tests, buf for the generate pipeline, migrate for
      # TestDBReset_* (internal/cli/db_reset*_test.go).
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Authenticated for the rate limit; see the same step in `test`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      - name: Check the test-job partition
        run: scripts/ci-test-packages.sh check
      - name: Go tests (internal/cli)
        # The same 30m budget as `test`: internal/cli alone measured
        # 665-692s under -race, so this is a hang detector, not a speed bound.
        run: go test -race -count=1 -timeout 30m $(scripts/ci-test-packages.sh cli)
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
      # Main only: a PR's cache is visible to that PR alone.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # The pull-request tier, run whole on main, then the guards. Three jobs in
  # one: main's own check that the tier pull requests are judged by still
  # passes (the full jobs above run a superset, but under different flags),
  # the producer of the go-build-short cache every test-short shard restores —
  # non-race, -short artifacts and test results that nothing else on main
  # compiles — and the guards (formerly `test-guards`), which build without
  # -race too, so they reuse that compile instead of a scope of their own.
  # One job, one cache entry, rather than one per shard: the repository's
  # cache budget is 10 GB (see "Build-cache note").
  test-short-warm:
    name: Test (-short whole tier, then guards)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-short-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-short-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-short-${{ runner.os }}-
            go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      - name: Go tests (-short, every package)
        run: go test -short -timeout 30m ./...
      - name: Check the test-job partition
        if: ${{ !cancelled() }}
        run: scripts/ci-test-packages.sh check
      - name: Go tests (guards)
        if: ${{ !cancelled() }}
        # -p 1: one guard at a time. Each is a whole-program or whole-project
        # workload that keeps every core busy by itself, so running them side
        # by side mostly stacks their memory peaks. Measured on a 16-core
        # laptop: 10.8 GB peak process-tree RSS at -p 4 against 6.9 GB at
        # -p 1, and -p 1 was not slower (132s against 217s). Full mode and
        # -count=1: the guards' whole-repo work skips under -short.
        run: go test -p 1 -count=1 -timeout 30m $(scripts/ci-test-packages.sh guards)
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
      # Main only, and after the tests so the entry carries their results.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # ── Windows: first runtime coverage for the cgo-free, Windows-ported CLI ──
  #
  # forge is cgo-free (KCL is loaded through purego) and builds for
  # windows/{amd64,arm64}. This job is what keeps that true at RUNTIME: it
  # builds, vets, runs the -short tier, and drives a real scaffold + render
  # (scripts/ci-windows-smoke.sh), which is the proof the KCL native-library
  # extraction + load works on Windows.
  #
  # TESTS. Every package except the repo-wide guards (`unit cli`: the two
  # sets the Linux Test jobs run between them), from the same
  # scripts/ci-test-packages.sh the Linux jobs use, so the set cannot drift
  # from `go list ./...`. The guards (tierguard, removalguard, deadcodeguard)
  # are excluded: they render whole projects, scan the whole tree or load the
  # whole program, are the slowest packages by far, and exercise
  # platform-independent logic already gated on Linux (deadcodeguard merges
  # linux, darwin and windows loads on every host, so its verdict does not
  # depend on the host it runs on). -short keeps the tier the repo defines for
  # fast loops; no -race (Linux's `test` job owns it). Tools the Linux job installs (buf, migrate)
  # are not installed here: tests needing them must skip under -short.
  #
  # ONE BUILD CACHE, SAVED ONLY FROM MAIN. Saving is the expensive half on
  # Windows: tarring tens of thousands of GOCACHE files on NTFS measured
  # 229-380s per cache, and this job used to save TWO caches of the same
  # directory — setup-go's `cache: true` (GOMODCACHE + GOCACHE, keyed on
  # go.sum) and the laddered one below — both after every PR run, about 10
  # minutes of a ~25-minute critical path spent on bookkeeping. A PR's cache
  # is scoped to its own ref and no other PR can restore it, so every PR save
  # bought at most a warm re-run of that one PR. Now setup-go caches nothing
  # here, PRs only RESTORE, and a push to main SAVES (after the tests, so the
  # entry carries their cached results too). Modules are downloaded rather
  # than restored: a module-cache restore is the same NTFS extraction plus the
  # zips — setup-go's combined restore measured 238s where the GOCACHE-only
  # one below measured 62-144s.
  #
  # PUSH TO MAIN ONLY (and workflow_dispatch). At 17-19 minutes this was the
  # slowest job on every pull request. A pull request gets windows-cross
  # instead: the windows build and vet, from Linux, in a couple of minutes.
  windows:
    name: Windows
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash ships on windows-latest. It is only the CI driver; forge
        # itself must not depend on bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The one cache is the laddered step below; see the job header.
          cache: false
      # GOCACHE is %LocalAppData%\go-build on Windows, not ~/.cache/go-build,
      # so ask Go rather than hardcode it. Ladder rationale: top of file.
      - name: Locate Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: go-build-windows-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-windows-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-windows-${{ runner.os }}-
      # CGO_ENABLED=0 is asserted, not assumed: the point is that no C
      # toolchain is needed, and windows-latest has one that would hide a
      # regression.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Vet (includes tests)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      # The arm64 BUILD stays on every PR: it is the proof forge still
      # compiles for windows/arm64. The arm64 VET does not: it re-vetted the
      # whole module (~4 min cold) to re-check what the amd64 vet above
      # already checked, since only GOARCH-specific files differ. It runs in
      # nightly.yml instead.
      - name: Cross-compile windows/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: arm64
        run: go build -o "$RUNNER_TEMP/forge-arm64.exe" ./cmd/forge
      - name: Go tests (-short)
        env:
          CGO_ENABLED: "0"
          # buf is not installed here (see the header), and a test that
          # needs it treats CI=true as "missing tool is a provisioning bug".
          # This is the documented override that turns that back into a skip.
          FORGE_E2E_REQUIRE_TOOLS: "0"
        # No -count=1: this is the -short tier, which the repo holds
        # cache-sound (reliant.md, "Testing tiers"), so a package whose
        # inputs did not change replays its result from the build cache main
        # last saved instead of re-running. -count=1 defeated exactly that.
        run: go test -short -timeout 30m $(scripts/ci-test-packages.sh unit cli)
      - name: Install forge
        env:
          CGO_ENABLED: "0"
        run: go install ./cmd/forge
      - name: Scaffold + render smoke
        run: scripts/ci-windows-smoke.sh
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
        with:
          path: ${{ steps.gocache.outputs.dir }}
      # Main only, and after the tests so the entry carries their results.
      # !cancelled(): a red main still compiled everything, and the next PR
      # restores the artifacts whether or not a test failed. The key carries
      # the sha, so this never collides with the entry it restored from.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # PUSH TO MAIN ONLY. On a pull request every package is already compiled
  # by the test shards and windows-cross; what this adds is the release
  # flags (-trimpath -buildvcs), which a code change almost never breaks
  # differently, and the go-licenses pass. No `needs:`: it used to wait for lint and every test job,
  # for no data dependency.
  build:
    name: Build (-trimpath) + go-licenses
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          # -trimpath below is part of the cache identity: artifacts built
          # with it do not match ones built without, so this job keeps its
          # own scope rather than sharing the test job's.
          path: ~/.cache/go-build
          key: go-build-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-build-${{ runner.os }}-
      - name: Go build
        # -trimpath makes builds reproducible across runners;
        # -buildvcs=true stamps the commit/dirty flag into runtime
        # debug/buildinfo so deployed binaries can be correlated to a
        # source commit without a separate manifest. Both flags must
        # match the Dockerfile / Taskfile so CI, Docker, and local
        # binaries hash identically from the same source.
        run: go build -trimpath -buildvcs=true ./cmd/...
      # The second license opinion (formerly the License Compliance job).
      # quick-checks' scripts/check-licenses.sh checks every Go dependency's
      # license on each pull request in ~40s; this go-licenses pass (~2 min,
      # most of it compiling go-licenses) is kept on main.
      - name: Install go-licenses
        if: ${{ !cancelled() }}
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        if: ${{ !cancelled() }}
        run: go-licenses check ./... --disallowed_types=forbidden,restricted
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  verify-generated:
    name: Verify Generated Code + Validate KCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # verify-generated and quick-checks (its vulnerability scan) both run
      # `go install ./cmd/forge` with identical flags, so they share ONE cache
      # scope, which this job saves on main.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-tools-${{ runner.os }}-
      - name: Install forge
        # THIS repo is forge. A scaffolded project pins the published forge
        # that generated it, but forge's own CI must verify the checkout under
        # test — installing a tag would validate every PR against the last
        # release, so no change to a template or an emitter could ever go
        # green until after it shipped. Build from the working tree instead.
        run: go install ./cmd/forge
      # verify-generated runs `forge generate`, whose "buf generate (Go
      # stubs)" step regenerates pkg/forgepb from proto/forge/v1/forge.proto
      # (buf.gen.yaml). Without buf on PATH the job dies with
      # `exec: "buf": executable file not found` before checking anything.
      #
      # Pinned rather than left to the action's default so the version is
      # visible here and cannot move under a byte-identical check. 1.50.0 is
      # the version every other buf install in these workflows resolves to
      # (buf-setup-action@v1's default); Taskfile.yml and the Makefile pin
      # none. Bump them together.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          # Authenticated for the rate limit; see the same step in `test`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # buf.gen.yaml runs protoc-gen-go as a `local:` plugin, and generate
      # formats its Go output with goimports. `forge tools install` puts both
      # on PATH at the versions go.mod resolves, the versions the committed
      # files were generated with (protoc-gen-go writes its own version into
      # pkg/forgepb/forge.pb.go's header). --force: a runner image's own copy
      # must not stand in for go.mod's version. Same step as the scaffolded
      # verify-generated job (internal/templates/ci/github/ci.yml.tmpl).
      - name: Install codegen tools
        run: forge tools install --force
      - name: Verify generated code
        run: forge ci verify-generated
      # Validate KCL used to be a job of its own; it shares this job's forge
      # install and cache scope, and a second runner bought only a second
      # minute of setup.
      # KCL_VERSION is pinned deliberately. Left unset, the installer
      # resolves "latest" through an UNAUTHENTICATED api.github.com call,
      # which is rate-limited to 60/hour per runner IP and shared across
      # every job on that host — when it is exhausted the script gets an
      # empty tag and dies with "The KCL version is not found", failing CI
      # for a reason that has nothing to do with the commit. Pinning also
      # stops a KCL release from changing this build without a commit.
      # The pin is templates.KCLVersion; TestKCLVersionIsPinnedEverywhere
      # holds it equal to the kcl-lang.io modules in go.mod, so the `kcl`
      # the tests shell out to is the KCL forge embeds.
      #
      # Not cached, and no ~/.kcl on PATH: on Linux the installer puts kcl in
      # /usr/local/bin, which is already on PATH. The cache stored the ~/.kcl
      # that was never created — an empty 227-byte entry — and a later hit
      # then SKIPPED the install and left the job with no kcl at all. The
      # install is ~1s; caching it was never worth a step that can wedge a
      # whole workflow.
      - name: Install KCL
        env:
          KCL_VERSION: v0.13.1
        run: |
          curl -fsSL https://kcl-lang.io/script/install-cli.sh | bash
          command -v kcl
          kcl --version
      - name: Validate KCL manifests
        if: ${{ !cancelled() }}
        run: forge ci validate-kcl
      - name: Trim the Go build cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/trim-go-build-cache
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # The cheap checks, in one job (they were the pre-commit, license-gate and
  # Vulnerability Scan jobs: four per pull request and per push).
  #
  #   pre-commit   the hooks in .pre-commit-config.yaml, so CI catches
  #                contributors who haven't installed pre-commit locally (hook
  #                versions are pinned there). go-vet-mod is skipped: lint runs
  #                `go vet ./...` against its warm build cache.
  #   licenses     blocks a change that pulls a non-permissive license into
  #                the Go import graph or the published web-runtime package.
  #                The risk is linking, not hosting: running unmodified
  #                copyleft software as a service is permitted (AGPL-3.0 §2),
  #                but IMPORTING an AGPL/GPL library into a proprietary binary
  #                reaches that binary's source. It happens silently in a
  #                routine `go get` of something with a transitive dep. The
  #                gate is an allowlist: an unrecognized license FAILS and
  #                needs a reasoned entry in .license-allowlist. web-runtime
  #                matters more than a consuming app's deps would: it is
  #                PUBLISHED, so its dependencies reach every project that
  #                installs it.
  #
  #   vulnerabilities  govulncheck through `forge ci vuln-scan --go`.
  #
  # Each check runs whatever the others concluded, so one red does not hide
  # another.
  quick-checks:
    name: Quick checks (pre-commit, licenses, govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # See `test`: unauthenticated release lookups are rate-limited
          # per runner IP, which once took the pre-commit job red at
          # "Install buf" having run nothing.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # The go-imports hook shells out to a goimports BINARY and fails with
      # "goimports not installed or available in the PATH" when it is absent
      # — the runner image does not ship one, and setup-go does not add it.
      - name: Install goimports
        # Pinned, for the same reason as govulncheck and go-licenses:
        # @latest makes the job non-reproducible (a hook can start
        # reformatting on a day nobody committed anything) and lets a
        # compromised upstream release run in CI. Dependabot watches this
        # file, so bumps arrive as PRs. v0.49.0 matches the golang.org/x/tools
        # already in go.mod, so the hook formats with the same version the
        # module builds against.
        run: go install golang.org/x/tools/cmd/goimports@v0.49.0
      - name: pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: go-vet-mod
      # The checker reads each dependency's LICENSE out of the module cache,
      # so the modules must be downloaded first. No build required.
      - name: Download modules
        if: ${{ !cancelled() }}
        run: go mod download
      - name: Check Go dependency licenses
        id: go-licenses
        if: ${{ !cancelled() }}
        run: ./scripts/check-licenses.sh
      # On failure, print the full inventory so the author can see every
      # dependency and its detected license without re-running locally.
      - name: Full Go license inventory (on failure)
        if: ${{ !cancelled() && steps.go-licenses.outcome == 'failure' }}
        run: ./scripts/check-licenses.sh --list
      - name: Install web-runtime's npm dependencies
        if: ${{ !cancelled() }}
        working-directory: web-runtime
        run: npm install --no-audit --no-fund
      - name: Check npm dependency licenses (web-runtime)
        id: npm-licenses
        if: ${{ !cancelled() }}
        run: ./scripts/check-npm-licenses.sh web-runtime
      - name: Full npm license inventory (on failure)
        if: ${{ !cancelled() && steps.npm-licenses.outcome == 'failure' }}
        run: ./scripts/check-npm-licenses.sh --list web-runtime
      # Vulnerability scan (formerly its own job): `forge ci vuln-scan`
      # applies forge.yaml's reviewed advisories, so it runs the forge built
      # from this checkout. The tools scope (verify-generated saves it) holds
      # that build; restore only.
      - name: Restore Go build cache (tools scope)
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-tools-${{ runner.os }}-
      - name: Install forge
        if: ${{ !cancelled() }}
        # THIS repo is forge: the forge that must run is the one being tested.
        run: go install ./cmd/forge
      - name: Install govulncheck
        if: ${{ !cancelled() }}
        # Pinned explicitly: @latest makes CI non-reproducible and lets a
        # compromised upstream release silently alter scan results. The
        # Dependabot config watches this file so bumps arrive as PRs.
        #
        # The pin has a FLOOR, not just a ceiling: govulncheck vendors
        # golang.org/x/tools to build the SSA it traces calls through, and a
        # copy older than the toolchain panics on syntax it cannot parse.
        # v1.1.4 vendored x/tools v0.29.0 and died with
        # `panic: unexpected expr: *ast.KeyValueExpr` the moment this repo
        # moved to Go 1.27 — a crash, not a finding, so the gate reported
        # nothing at all. Keep this at or above the release that supports the
        # Go version in go.mod.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Go vulnerability check
        if: ${{ !cancelled() }}
        run: forge ci vuln-scan --go

  # CI gate: one check that is red exactly when any job above failed or was
  # cancelled (a skipped job — a main-only lane on a pull request — is not a
  # failure). It is the check to require if a ruleset ever requires one, so a
  # job added above must be added to `needs` too; internal/ciguard fails if
  # one is missing. It also writes every job's wall time and the run's
  # critical path to the run summary (scripts/ci-run-timings.sh), so the
  # pull-request budget is visible on every run.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - lint
      - test-short
      - flake-gate
      - windows-cross
      - test
      - test-cli
      - test-short-warm
      - windows
      - build
      - verify-generated
      - quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Job wall times
        env:
          GH_TOKEN: ${{ github.token }}
        # Reporting only: a failed API call must not turn the gate red.
        run: scripts/ci-run-timings.sh || echo "::warning::could not read this run's job timings"
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          red=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$red" ]; then
            echo "::error::not every job passed:"
            echo "$red"
            exit 1
          fi
          echo "every job passed or was skipped"
