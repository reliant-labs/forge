# Code generated by forge. DO NOT EDIT.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run on a pull request only. On main the run in progress
# always finishes: every push to main shares one group, so cancelling there let
# each merge kill the run before it — usually while its jobs were still queued
# for a runner. control-plane lost every main run for 2.5 hours that way on
# 2026-10-11 (control-plane#831). GitHub keeps at most one PENDING run per
# group and a newer push replaces it, so a burst of merges costs one extra
# run, not one per merge. Every workflow here follows the same rule, and
# internal/templates/ci_concurrency_test.go holds them to it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Go version is read from go.mod's `go` directive via setup-go's
# `go-version-file` input so CI stays in sync with the project's declared
# version without a duplicate env var that drifts.
#
# Build-cache note (the "Restore Go build cache" steps below).
#
# setup-go's own `cache: true` DOES cache the build cache — it saves
# `go env GOCACHE` alongside `go env GOMODCACHE`. What it does not do is
# give that cache any RESTORE-KEYS: cache-restore.ts calls
# restoreCache(paths, primaryKey) with no fallback list, and the primary
# key ends in a hash of go.sum. So the hit is all-or-nothing — touch a
# single dependency and the restore misses, and the job recompiles the
# world from cold rather than reusing the ~99% of build artifacts that
# did not change.
#
# A go.sum change is not the rare case here: Dependabot bumps it
# continuously, and that is exactly the PR where a cold compile is least
# affordable. The steps below add a second, keyed
# cache over the same GOCACHE directory with a restore-key ladder, so a
# go.sum change degrades to "reuse the previous commit's build cache"
# instead of "start from nothing".
#
# Keys are ordered most- to least-specific:
#   …-<go.sum hash>-<sha>  exact commit (a re-run reuses everything)
#   …-<go.sum hash>-       same deps, different code
#   …-                     same Go version, any deps  ← the Dependabot case
#
# GOCACHE is content-addressed and self-validating: every entry is keyed
# by the hash of its own inputs, so a stale entry is ignored rather than
# mis-used. That is what makes a loose restore-key safe here — the worst
# case of an old cache is a miss on the changed packages, never a wrong
# object.
#
# PULL REQUESTS RESTORE; ONLY MAIN SAVES. Each laddered cache is a
# `actions/cache/restore` step at the top of its job and an
# `actions/cache/save` step at the bottom that runs only on a push to main.
# A cache a pull request saves is scoped to that PR's ref: no other PR, and
# not main, can restore it. All it bought was a warm re-run of the same PR,
# and it cost everyone else their hits. The repository's cache budget is
# 10 GB, and with every PR job saving its own entry (the Windows job alone
# saved ~3.8 GB per run) the budget held about an hour of entries: on
# 2026-10-15 there was no main entry left for test-guards, windows or the
# tools scope, and the Test job ran 1045-1302s on a miss against 529s on a
# hit. Saving after the job's real work (not in a post step) also means a
# red main still saves what it compiled: `!cancelled()`, not `success()`.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint type-checks the whole repo, which is a full compile
      # in all but name. Its own action caches the analyzer results; this
      # caches the Go build artifacts underneath them.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-lint-${{ runner.os }}-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and kept equal to templates.GolangciLintVersion by
          # TestGolangciLintVersionIsPinnedEverywhere. `latest` let v2.14.0
          # add seven findings on untouched lines with no commit in between.
          version: v2.14.0
          # No --timeout: it would override .golangci.yml's `timeout: 20m`,
          # which is deliberate — a cold cache on a busy runner crosses 5m and
          # exits 4 ("Timeout exceeded") with 0 issues, a red PR over clean code.
          # Whole-repo, not only-new-issues. The job analyses the whole repo
          # anyway (type-checking needs it); only-new-issues only HIDES what it
          # found outside the diff. That is how main stayed green while
          # failing its own linter, and the action cannot fetch a PR patch over
          # 20k lines, so large PRs silently fell back to whole-repo regardless.
          only-new-issues: false
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # ── Go tests: three jobs, partitioned by scripts/ci-test-packages.sh ────
  #
  # `test` runs every package under -race EXCEPT internal/cli and the
  # repo-wide guards (internal/tierguard, internal/removalguard,
  # internal/deadcodeguard); `test-cli` runs internal/cli under -race;
  # `test-guards` runs the guards. Each on a runner of its own. The script is
  # the single list and each job's first step proves the three sets partition
  # `go list ./...`, so a package can neither drop out of every job nor run in
  # two. `task test` runs the same three sets locally.
  #
  # WHY internal/cli ALONE. Under -race it took 665-692s of `test`'s
  # 1215-1253s `go test` step by itself, sharing four cores with every other
  # package. In a job of its own the two halves run side by side, and the
  # lane's wall time is the slower half (the script's header has the detail).
  #
  # WHY THE GUARDS. They are the two slowest packages by a wide margin (~980s and
  # ~700s under -race; the next is ~410s) and the two largest in memory.
  # Inside `go test -race ./...` they co-resided with every other test binary
  # on one 16 GB runner, and the job was OOM-killed about one run in three —
  # "The runner has received a shutdown signal", exit 143, no test failed.
  # A job boundary bounds that by construction; go test's package
  # scheduling only ever bounded it by luck. Measured numbers are in the PR
  # that introduced this split (#304).
  #
  # deadcodeguard joined them when its scan began type-checking the whole
  # program once per target OS (#469) and held all three loads at once:
  # ~23 GB RSS under -race, measured locally, and the Test job died on most
  # runs from #469 on. Its scan now holds one load at a time (~12.7 GB under
  # -race, ~5.4 GB without), and here it is bounded by the job boundary too.
  #
  # WHY NO -race FOR THE GUARDS. Their own code has no concurrency worth
  # detecting — removalguard is a regex scan over files, tierguard diffs
  # rendered trees, deadcodeguard walks syntax trees after a load — and the
  # render work happens in child processes. The production code those
  # renders exercise (generate, codegen, cli) is race-tested by its own
  # packages in `test`. -race cost them ~100x in removalguard (10s → ~980s),
  # ~5x in tierguard and ~4x in deadcodeguard. e2e-suite.yml omits -race for
  # the same reason.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # This job compiles far more than it looks: the suite scaffolds real
      # projects and runs real `go build` / `go mod tidy` inside them, and
      # it runs under -race, which is a separate set of build artifacts
      # from the non-race ones every other job produces. It is the job
      # that benefits most from a warm GOCACHE.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-${{ runner.os }}-
      # pkg/pgtest boots postgres for the DB-backed tests; see the action.
      - uses: ./.github/actions/embedded-postgres-cache
      # internal/tierguard renders real fixture projects, which drives the
      # generate pipeline's "buf generate (Go stubs)" step. Without buf on
      # PATH those guards fail with `exec: "buf": executable file not found`
      # — they deliberately fail rather than report an empty inventory as a
      # pass, so this is a hard dependency of the test job, not a nicety.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Without a token the action resolves buf's release through an
          # UNAUTHENTICATED api.github.com call, rate-limited to 60/hour
          # per runner IP and shared with every other job on that host.
          # Exhausted, the step dies with "API rate limit exceeded" and
          # the job fails for a reason that has nothing to do with the
          # commit. The built-in token lifts that to 1000/hour per
          # repository; contents: read is all a release lookup needs.
          # Same failure mode ci.yml already pins KCL_VERSION to avoid.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # TestDBReset_* shell out to the golang-migrate CLI and carry no e2e
      # tag. They live in internal/cli (test-cli installs it too); this job
      # keeps the install so no package here can lose a tool by moving.
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate

      - name: Check the test-job partition
        run: scripts/ci-test-packages.sh check
      - name: Go tests
        # -timeout is explicit rather than left to `go test`'s 10-minute
        # default. A panicking timeout fails the whole job and hides every
        # other package's result behind something that reads as a hang rather
        # than as one slow package. A generous explicit budget keeps a genuine
        # deadlock detectable while making the failure mode legible.
        run: go test -race -count=1 -timeout 30m $(scripts/ci-test-packages.sh unit)
      - name: Local registry maintenance integration
        run: go test -race -tags=integration -count=1 -timeout=5m ./internal/storage
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  test-cli:
    name: Test (internal/cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Its own scope: internal/cli's -race test binary and the projects its
      # tests scaffold and build. It falls back to `test`'s scope, which holds
      # the same -race artifacts for every package internal/cli imports.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-cli-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-test-cli-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-cli-${{ runner.os }}-
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # The same toolchain as `test`, for the same reasons: postgres for the
      # DB-backed tests, buf for the generate pipeline, migrate for
      # TestDBReset_* (internal/cli/db_reset*_test.go).
      - uses: ./.github/actions/embedded-postgres-cache
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Authenticated for the rate limit; see the same step in `test`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      - name: Check the test-job partition
        run: scripts/ci-test-packages.sh check
      - name: Go tests (internal/cli)
        # The same 30m budget as `test`: internal/cli alone measured
        # 665-692s under -race, so this is a hang detector, not a speed bound.
        run: go test -race -count=1 -timeout 30m $(scripts/ci-test-packages.sh cli)
      # Main only: a PR's cache is visible to that PR alone.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  test-guards:
    name: Test (guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Its own key: this job builds WITHOUT -race, a different artifact set
      # from `test`'s, so sharing a key would have each job evict the other's.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-guards-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-test-guards-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-guards-${{ runner.os }}-
      # tierguard's fixture renders open a postgres shadow DB; see the action.
      - uses: ./.github/actions/embedded-postgres-cache
      # tierguard's fixture renders run the generate pipeline's buf step; it
      # fails without buf rather than reporting an empty inventory as a pass.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Authenticated for the rate limit; see the same step in `test`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install golang-migrate CLI
        uses: ./.github/actions/install-migrate
      - name: Check the test-job partition
        run: scripts/ci-test-packages.sh check
      - name: Go tests (guards)
        # -p 1: one guard at a time. Each is a whole-program or whole-project
        # workload that keeps every core busy by itself, so running them side
        # by side mostly stacks their memory peaks. Measured on a 16-core
        # laptop: 10.8 GB peak process-tree RSS at -p 4 against 6.9 GB at
        # -p 1, and -p 1 was not slower (132s against 217s).
        run: go test -p 1 -count=1 -timeout 30m $(scripts/ci-test-packages.sh guards)
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  # ── Windows: first runtime coverage for the cgo-free, Windows-ported CLI ──
  #
  # forge is cgo-free (KCL is loaded through purego) and builds for
  # windows/{amd64,arm64}. This job is what keeps that true at RUNTIME: it
  # builds, vets, runs the -short tier, and drives a real scaffold + render
  # (scripts/ci-windows-smoke.sh), which is the proof the KCL native-library
  # extraction + load works on Windows.
  #
  # TESTS. Every package except the repo-wide guards (`unit cli`: the two
  # sets the Linux Test jobs run between them), from the same
  # scripts/ci-test-packages.sh the Linux jobs use, so the set cannot drift
  # from `go list ./...`. The guards (tierguard, removalguard, deadcodeguard)
  # are excluded: they render whole projects, scan the whole tree or load the
  # whole program, are the slowest packages by far, and exercise
  # platform-independent logic already gated on Linux (deadcodeguard merges
  # linux, darwin and windows loads on every host, so its verdict does not
  # depend on the host it runs on). -short keeps the tier the repo defines for
  # fast loops; no -race (Linux's `test` job owns it). Tools the Linux job installs (buf, migrate)
  # are not installed here: tests needing them must skip under -short.
  #
  # ONE BUILD CACHE, SAVED ONLY FROM MAIN. Saving is the expensive half on
  # Windows: tarring tens of thousands of GOCACHE files on NTFS measured
  # 229-380s per cache, and this job used to save TWO caches of the same
  # directory — setup-go's `cache: true` (GOMODCACHE + GOCACHE, keyed on
  # go.sum) and the laddered one below — both after every PR run, about 10
  # minutes of a ~25-minute critical path spent on bookkeeping. A PR's cache
  # is scoped to its own ref and no other PR can restore it, so every PR save
  # bought at most a warm re-run of that one PR. Now setup-go caches nothing
  # here, PRs only RESTORE, and a push to main SAVES (after the tests, so the
  # entry carries their cached results too). Modules are downloaded rather
  # than restored: a module-cache restore is the same NTFS extraction plus the
  # zips — setup-go's combined restore measured 238s where the GOCACHE-only
  # one below measured 62-144s.
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash ships on windows-latest. It is only the CI driver; forge
        # itself must not depend on bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The one cache is the laddered step below; see the job header.
          cache: false
      # GOCACHE is %LocalAppData%\go-build on Windows, not ~/.cache/go-build,
      # so ask Go rather than hardcode it. Ladder rationale: top of file.
      - name: Locate Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: go-build-windows-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-windows-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-windows-${{ runner.os }}-
      # CGO_ENABLED=0 is asserted, not assumed: the point is that no C
      # toolchain is needed, and windows-latest has one that would hide a
      # regression.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Vet (includes tests)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      # The arm64 BUILD stays on every PR: it is the proof forge still
      # compiles for windows/arm64. The arm64 VET does not: it re-vetted the
      # whole module (~4 min cold) to re-check what the amd64 vet above
      # already checked, since only GOARCH-specific files differ. It runs in
      # nightly.yml instead.
      - name: Cross-compile windows/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: arm64
        run: go build -o "$RUNNER_TEMP/forge-arm64.exe" ./cmd/forge
      - name: Go tests (-short)
        env:
          CGO_ENABLED: "0"
          # buf is not installed here (see the header), and a test that
          # needs it treats CI=true as "missing tool is a provisioning bug".
          # This is the documented override that turns that back into a skip.
          FORGE_E2E_REQUIRE_TOOLS: "0"
        # No -count=1: this is the -short tier, which the repo holds
        # cache-sound (reliant.md, "Testing tiers"), so a package whose
        # inputs did not change replays its result from the build cache main
        # last saved instead of re-running. -count=1 defeated exactly that.
        run: go test -short -timeout 30m $(scripts/ci-test-packages.sh unit cli)
      - name: Install forge
        env:
          CGO_ENABLED: "0"
        run: go install ./cmd/forge
      - name: Scaffold + render smoke
        run: scripts/ci-windows-smoke.sh
      # Main only, and after the tests so the entry carries their results.
      # !cancelled(): a red main still compiled everything, and the next PR
      # restores the artifacts whether or not a test failed. The key carries
      # the sha, so this never collides with the entry it restored from.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  build:
    name: Build
    needs: [lint, test, test-cli, test-guards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          # -trimpath below is part of the cache identity: artifacts built
          # with it do not match ones built without, so this job keeps its
          # own scope rather than sharing the test job's.
          path: ~/.cache/go-build
          key: go-build-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-build-${{ runner.os }}-
      - name: Go build
        # -trimpath makes builds reproducible across runners;
        # -buildvcs=true stamps the commit/dirty flag into runtime
        # debug/buildinfo so deployed binaries can be correlated to a
        # source commit without a separate manifest. Both flags must
        # match the Dockerfile / Taskfile so CI, Docker, and local
        # binaries hash identically from the same source.
        run: go build -trimpath -buildvcs=true ./cmd/...
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  verify-generated:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # verify-generated, validate-kcl and vuln-scan all run
      # `go install ./cmd/forge` with identical flags, so they share ONE
      # cache scope: whichever job finishes first warms the other two on
      # the next run, instead of three jobs each compiling forge from
      # cold in parallel.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-tools-${{ runner.os }}-
      - name: Install forge
        # THIS repo is forge. A scaffolded project pins the published forge
        # that generated it, but forge's own CI must verify the checkout under
        # test — installing a tag would validate every PR against the last
        # release, so no change to a template or an emitter could ever go
        # green until after it shipped. Build from the working tree instead.
        run: go install ./cmd/forge
      # verify-generated runs `forge generate`, whose "buf generate (Go
      # stubs)" step regenerates pkg/forgepb from proto/forge/v1/forge.proto
      # (buf.gen.yaml). Without buf on PATH the job dies with
      # `exec: "buf": executable file not found` before checking anything.
      #
      # Pinned rather than left to the action's default so the version is
      # visible here and cannot move under a byte-identical check. 1.50.0 is
      # the version every other buf install in these workflows resolves to
      # (buf-setup-action@v1's default); Taskfile.yml and the Makefile pin
      # none. Bump them together.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          # Authenticated for the rate limit; see the same step in `test`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # buf.gen.yaml runs protoc-gen-go as a `local:` plugin, and generate
      # formats its Go output with goimports. `forge tools install` puts both
      # on PATH at the versions go.mod resolves, the versions the committed
      # files were generated with (protoc-gen-go writes its own version into
      # pkg/forgepb/forge.pb.go's header). --force: a runner image's own copy
      # must not stand in for go.mod's version. Same step as the scaffolded
      # verify-generated job (internal/templates/ci/github/ci.yml.tmpl).
      - name: Install codegen tools
        run: forge tools install --force
      - name: Verify generated code
        run: forge ci verify-generated
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  validate-kcl:
    name: Validate KCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Shares the tools scope with verify-generated and vuln-scan — same
      # `go install ./cmd/forge`, same flags, same artifacts.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-tools-${{ runner.os }}-
      # KCL_VERSION is pinned deliberately. Left unset, the installer
      # resolves "latest" through an UNAUTHENTICATED api.github.com call,
      # which is rate-limited to 60/hour per runner IP and shared across
      # every job on that host — when it is exhausted the script gets an
      # empty tag and dies with "The KCL version is not found", failing CI
      # for a reason that has nothing to do with the commit. Pinning also
      # stops a KCL release from changing this build without a commit.
      # The pin is templates.KCLVersion; TestKCLVersionIsPinnedEverywhere
      # holds it equal to the kcl-lang.io modules in go.mod, so the `kcl`
      # the tests shell out to is the KCL forge embeds.
      #
      # Not cached, and no ~/.kcl on PATH: on Linux the installer puts kcl in
      # /usr/local/bin, which is already on PATH. The cache stored the ~/.kcl
      # that was never created — an empty 227-byte entry — and a later hit
      # then SKIPPED the install and left the job with no kcl at all. The
      # install is ~1s; caching it was never worth a step that can wedge a
      # whole workflow.
      - name: Install KCL
        env:
          KCL_VERSION: v0.13.1
        run: |
          curl -fsSL https://kcl-lang.io/script/install-cli.sh | bash
          command -v kcl
          kcl --version
      - name: Install forge
        # Same reason as verify-generated: this step runs `forge`, and in
        # forge's own repo the forge that must run is the one being tested.
        run: go install ./cmd/forge
      - name: Validate KCL manifests
        run: forge ci validate-kcl
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  vuln-scan:
    name: Vulnerability Scan
    needs: [lint, test, test-cli, test-guards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Shares the tools scope with verify-generated and validate-kcl.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-tools-${{ runner.os }}-
      - name: Install govulncheck
        # Pinned explicitly: @latest makes CI non-reproducible and lets a
        # compromised upstream release silently alter scan results. The
        # Dependabot config watches this file so bumps arrive as PRs.
        #
        # The pin has a FLOOR, not just a ceiling: govulncheck vendors
        # golang.org/x/tools to build the SSA it traces calls through, and a
        # copy older than the toolchain panics on syntax it cannot parse.
        # v1.1.4 vendored x/tools v0.29.0 and died with
        # `panic: unexpected expr: *ast.KeyValueExpr` the moment this repo
        # moved to Go 1.27 — a crash, not a finding, so the gate reported
        # nothing at all. Keep this at or above the release that supports the
        # Go version in go.mod.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Install forge
        # Same reason as verify-generated: this step runs `forge`, and in
        # forge's own repo the forge that must run is the one being tested.
        run: go install ./cmd/forge
      - name: Go vulnerability check
        run: forge ci vuln-scan --go
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # go-licenses is compiled from source on every run and then walks
      # the whole dependency graph, both of which are pure compile work.
      # Its own scope: it is the only job that builds go-licenses, and it
      # never builds ./cmd/forge.
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-licenses-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-licenses-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-licenses-${{ runner.os }}-
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        run: go-licenses check ./... --disallowed_types=forbidden,restricted
      # Main only; see "Build-cache note" at the top of this file.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}
