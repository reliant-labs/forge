# End-to-end smoke test for `forge project new`. Scaffolds a service project from
# the forge binary built at this commit, then runs generate/build/lint/test
# against the generated tree. Catches scaffold-level regressions before
# downstream migration/porting work depends on a broken baseline.
name: E2E Scaffold

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: forge project new smoke test
    runs-on: ubuntu-latest
    env:
      # Set once so every step uses the same workspace path.
      E2E_DIR: ${{ github.workspace }}/e2e-workspace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # forge is 2 modules (root CLI + pkg/ runtime lib). The default key
          # is the root go.sum only, which misses a pkg/ dependency change —
          # and pkg/ is exactly what the release flow touches.
          cache-dependency-path: |
            go.sum
            pkg/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # See ci.yml: unauthenticated release lookups share a 60/hour
          # per-runner-IP budget and fail the job for a reason unrelated
          # to the commit.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Put $HOME/go/bin on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install forge from current checkout
        run: |
          echo "::group::install forge + contractlint"
          if go install ./cmd/forge ./cmd/contractlint; then
            echo "::endgroup::"
            echo "forge: $(command -v forge)"
            forge --version || true
            echo "✅ install forge"
          else
            echo "::endgroup::"
            echo "❌ install forge"
            exit 1
          fi

      - name: forge tools install
        run: |
          if forge tools install; then
            echo "✅ forge tools install"
          else
            echo "❌ forge tools install"
            exit 1
          fi

      - name: Prepare clean workspace
        run: |
          rm -rf "$E2E_DIR"
          mkdir -p "$E2E_DIR"
          echo "✅ workspace ready at $E2E_DIR"

      - name: forge project new e2e-test
        working-directory: ${{ env.E2E_DIR }}
        run: |
          if forge project new e2e-test \
              --kind service \
              --mod github.com/e2e/e2e-test \
              --service api \
              --frontend admin; then
            echo "✅ forge project new"
          else
            echo "❌ forge project new"
            exit 1
          fi

      - name: forge generate
        working-directory: ${{ env.E2E_DIR }}/e2e-test
        run: |
          if forge generate; then
            echo "✅ forge generate"
          else
            echo "❌ forge generate"
            exit 1
          fi

      - name: go mod tidy
        working-directory: ${{ env.E2E_DIR }}/e2e-test
        run: |
          if go mod tidy; then
            echo "✅ go mod tidy"
          else
            echo "❌ go mod tidy"
            exit 1
          fi

      - name: go build
        working-directory: ${{ env.E2E_DIR }}/e2e-test
        run: |
          if go build ./...; then
            echo "✅ go build"
          else
            echo "❌ go build"
            exit 1
          fi

      - name: forge lint
        working-directory: ${{ env.E2E_DIR }}/e2e-test
        run: |
          if forge lint; then
            echo "✅ forge lint"
          else
            echo "❌ forge lint"
            exit 1
          fi

      - name: go test
        working-directory: ${{ env.E2E_DIR }}/e2e-test
        run: |
          if go test ./...; then
            echo "✅ go test"
          else
            echo "❌ go test"
            exit 1
          fi

      # Frontend gate: install, TYPECHECK, BUILD, then run the scaffolded
      # Vitest suite against the admin frontend.
      #
      # This step used to run `npm install` then `npm test` and stop there.
      # `npm test` is `vitest run` — it executes the five scaffolded unit
      # tests and nothing else. It never compiled the generated tree, so a
      # generated page that does not typecheck, or a route that Next cannot
      # build, shipped green: the two failure modes that actually reach users
      # first were the two this lane did not look at.
      #
      # Order matters. `npm run typecheck` runs first, against the tsconfig
      # as scaffolded: `next build` REWRITES tsconfig.json (it appends
      # .next-prod/types/**/*.ts to `include`), so a typecheck after a build
      # is a typecheck of a different project. Both are kept because they see
      # different things — `next build` type-checks the route graph it
      # compiles, `tsc --noEmit` covers everything in tsconfig's include,
      # test files and unreferenced modules included.
      - name: npm typecheck + build + test (frontend)
        working-directory: ${{ env.E2E_DIR }}/e2e-test
        run: |
          # The scaffold above passes --frontend admin. If nothing is here,
          # `forge project new` did not honour the flag — that is a scaffold
          # regression and the exact thing this workflow exists to catch, so
          # it FAILS. (It used to `exit 0` with an ℹ️, which reported this
          # lane green for a run in which it did nothing.) A future cli/library
          # variant of this workflow should pass its own expectation in, not
          # inherit a step that shrugs.
          FE_DIR="$(find frontends -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n1 || true)"
          if [ -z "$FE_DIR" ]; then
            echo "❌ no frontend under frontends/ — the scaffold was invoked with --frontend admin"
            exit 1
          fi
          echo "Frontend at: $FE_DIR"
          cd "$FE_DIR"
          if npm install --no-audit --no-fund --prefer-offline; then
            echo "✅ npm install"
          else
            echo "❌ npm install"
            exit 1
          fi
          if npm run typecheck; then
            echo "✅ npm run typecheck (tsc --noEmit)"
          else
            echo "❌ npm run typecheck (tsc --noEmit)"
            exit 1
          fi
          if npm run build; then
            echo "✅ npm run build (next build)"
          else
            echo "❌ npm run build (next build)"
            exit 1
          fi
          # vitest exits 1 on "No test files found" (passWithNoTests is not
          # set in the scaffold's vitest.config.ts), so this cannot pass
          # vacuously if the scaffold ever stops emitting its unit tests.
          if npm test --silent; then
            echo "✅ npm test (vitest run)"
          else
            echo "❌ npm test (vitest run)"
            exit 1
          fi

      - name: Upload generated tree on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scaffold-tree
          path: ${{ env.E2E_DIR }}
          # Cap retention — this is debug bait, not a release artifact.
          retention-days: 7
          if-no-files-found: warn
