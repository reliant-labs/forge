# The `-tags e2e` suite. All of it.
#
# WHAT THIS FIXES. forge's e2e tests live behind `//go:build e2e`. Until this
# workflow existed, nothing in CI passed that tag except fixture-corpus.yml,
# and that one narrows itself with `-run 'TestE2EFixtureCorpus'`. Net: 5 of the
# suite's 52 tests ran. The other 47 — every scaffold-shape test, every
# frontend build gate, the lint-clean invariants, the KCL renders — had never
# executed in CI, while three green checkmarks said the opposite. `go test
# -race ./...` in ci.yml does not compile these files; neither does
# golangci-lint, which is configured with no build tags. They were invisible to
# every gate forge had.
#
# THREE JOBS, DELIBERATELY.
#
#   compile   ~2 min. `go build`/`go vet` under the tag. Its own job because
#             the cheapest and commonest breakage in a tagged file is that it
#             stopped compiling, and until today NOTHING in CI would have
#             noticed. Fast feedback on that class should not wait behind npm.
#
#   suite     the whole thing, sharded. Measured cost: 5002 test-seconds
#             across 52 e2e tests on a 12-core dev box (7m39s wall there);
#             a 4-vCPU ubuntu-latest runner is roughly 2x slower per core, so
#             one unsharded job is ~45-60 minutes. Four shards put it at
#             ~15-20 minutes, which is the envelope forge's existing e2e lanes
#             already occupy — and a gate nobody waits for is a gate people
#             learn to merge past.
#
#   ledger    aggregates the shards into ONE report: what ran, what did not,
#             and whether the shards between them covered every test. Runs
#             `if: always()`, because a job that only reports what ran when it
#             passed is the exact failure mode this workflow exists to delete.
#
# THE SHARD PARTITION IS DERIVED AND AUDITED, NOT MAINTAINED. Sharding
# introduces a way to silently drop a test, which is the disease being treated
# here, so it is nailed down three times over:
#
#   1. The list comes from `go test -list '.*'` at run time — the same
#      enumeration `go test` itself uses. Nobody types a test name.
#   2. The split is `NR % job-total == shard`, which partitions every line
#      exactly once, and job-total comes from `strategy.job-total` so it
#      cannot drift from the matrix.
#   3. Each shard PRINTS the tests it owns and asserts that the number of
#      top-level tests the run actually reported equals the number it was
#      assigned; the ledger then asserts the union of the shards equals the
#      full list and that no shard is missing entirely.
#
# A `-run` filter that names tests by hand has none of that, which is why
# fixture-corpus.yml's filter is what let 47 tests disappear. Do not add one.
#
# NO -race. The suite's work happens in subprocesses (forge, go build, npm,
# kcl); the race detector cannot see into them, and it roughly doubles the
# compile cost of the in-process half. ci.yml keeps -race where it pays: the
# unit lane.
#
# OVERLAP WITH fixture-corpus.yml. This workflow runs the corpus too, so those
# five tests execute twice per PR. That is knowingly accepted for now: you
# retire a lane that works AFTER its replacement has proven itself, not in the
# same change that introduces one which has never run. Once this lane has a
# track record, fixture-corpus.yml can be deleted — its artifact upload is
# already reproduced below.
name: E2E Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile (-tags e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # forge is 2 modules (root CLI + pkg/ runtime lib). The default key
          # is the root go.sum only, which misses a pkg/ dependency change —
          # and pkg/ is exactly what the release flow touches.
          cache-dependency-path: |
            go.sum
            pkg/go.sum
      # Both, not just build: `go vet` type-checks the test files themselves
      # (an unused import, a helper whose signature moved), which `go build`
      # does not reach.
      - name: go build -tags e2e
        run: go build -tags e2e ./...
      - name: go vet -tags e2e
        run: go vet -tags e2e ./...

  suite:
    name: e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [compile]
    timeout-minutes: 75
    strategy:
      # One shard's failure must not cancel the others: the ledger's job is to
      # report the WHOLE picture, and it cannot do that from a cancelled run.
      fail-fast: false
      matrix:
        # Four is the measured balance. Each shard pays ~5 minutes of setup
        # (checkout, Go, node, kcl, golangci-lint, forge tools), so more
        # shards trade test time for setup time; at four, setup is ~25% of the
        # shard and the slowest single test (TestE2EFixtureCorpusCRUDLifecycle,
        # 342s locally → ~11 min here) is already close to the floor. Raising
        # this number needs no other edit: strategy.job-total follows it.
        shard: [0, 1, 2, 3]
    env:
      # ── The whole point of this workflow ─────────────────────────────
      # internal/cli's requireTool skips a missing tool on a laptop and
      # FAILS on a missing tool here. Without this, every install step
      # below could break and the suite would report green having skipped
      # everything it could not run. Set explicitly rather than leaning on
      # GitHub's CI=true so the requirement is written down next to the
      # installs that satisfy it.
      FORGE_E2E_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # forge is 2 modules (root CLI + pkg/ runtime lib). The default key
          # is the root go.sum only, which misses a pkg/ dependency change —
          # and pkg/ is exactly what the release flow touches.
          cache-dependency-path: |
            go.sum
            pkg/go.sum

      # ── Toolchain. Every tool the suite reaches for, because with
      # FORGE_E2E_REQUIRE_TOOLS=1 a missing one is now a red job, not a
      # quiet skip. The set is enumerated from requireTool call sites plus
      # every exec.LookPath under internal/cli/*_e2e_test.go.

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      # KCL install-and-cache. The key carries the VERSION so a hit means
      # "this version" and bumping the pin actually takes effect.
      - name: Cache KCL CLI
        uses: actions/cache@v4
        id: kcl-cache
        with:
          path: ~/.kcl
          key: kcl-cli-${{ runner.os }}-v0.11.2

      # The install condition is the BINARY, not the cache-hit flag, and that
      # distinction is the whole fix. actions/cache saves the path at job end
      # whatever happened during the job, so a run whose install failed (or
      # never ran, because the tool was not yet needed) stores an EMPTY ~/.kcl
      # — a 227-byte entry, observed. Every later run then gets a cache HIT,
      # skips the install on that flag, finds no binary, and dies in the
      # tool-verification step below. All four shards, before a single test
      # ran, twice; and re-keying only moves the poison to the new key, since
      # the next failing run re-saves it there.
      #
      # Asking whether $HOME/.kcl/bin/kcl is executable makes a hollow cache
      # entry self-healing: the install simply re-runs. A good entry still
      # skips it, which is the speedup the cache is for.
      #
      # KCL_VERSION is pinned deliberately, matching ci.yml. Left unset, the
      # installer resolves "latest" through an UNAUTHENTICATED api.github.com
      # call, rate-limited to 60/hour per runner IP and shared across every
      # job on that host — when it is exhausted the script gets an empty tag
      # and dies with "The KCL version is not found", failing CI for a reason
      # that has nothing to do with the commit. This suite fans out to four
      # shards, so it burns that budget faster than any other lane.
      - name: Install KCL
        env:
          KCL_VERSION: v0.11.2
        run: |
          if [ -x "$HOME/.kcl/bin/kcl" ]; then
            echo "kcl already present ($("$HOME/.kcl/bin/kcl" --version 2>&1 | head -1))"
            exit 0
          fi
          echo "no usable kcl in ~/.kcl (cache-hit=${{ steps.kcl-cache.outputs.cache-hit }}) — installing"
          curl -fsSL https://kcl-lang.io/script/install-cli.sh | bash
          test -x "$HOME/.kcl/bin/kcl"

      - name: Add KCL to PATH
        run: echo "$HOME/.kcl/bin" >> "$GITHUB_PATH"

      - name: Put $HOME/go/bin on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # golangci-lint at `latest`, matching ci.yml's lint job and
      # scripts/bootstrap.sh. The trade-off is deliberate and it is the
      # opposite of the govulncheck pin two files over: what these tests
      # assert is that forge's SCAFFOLD OUTPUT is lint-clean under the
      # golangci a real user has, and a real user has latest. A pin would
      # keep this lane green through exactly the upstream release that
      # starts failing every `forge lint` in the field.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" latest
          golangci-lint --version

      # npm's content-addressable store. Same reasoning as
      # fixture-corpus.yml: setup-node's `cache: npm` keys on a checked-in
      # lockfile and every lockfile here is generated at test time, so key
      # on the template that decides the dependency set instead.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('internal/templates/frontend/nextjs/package.json.tmpl') }}
          restore-keys: e2e-npm-${{ runner.os }}-

      # pkg/pgtest boots ONE embedded postgres per test process and shares
      # it (see sharedTestPostgres). The binary is downloaded and extracted
      # on first use into the user cache dir; caching it saves that on
      # every subsequent run and removes a network dependency from the
      # critical path.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/forge/embedded-postgres
          key: e2e-embedded-postgres-${{ runner.os }}-${{ hashFiles('pkg/go.sum') }}
          restore-keys: e2e-embedded-postgres-${{ runner.os }}-

      # The tests build the forge binary themselves — the binary under test
      # must come from THIS commit — so this install exists only to provide
      # `forge tools install`, which puts protoc-gen-go and
      # protoc-gen-connect-go where the generate pipeline's buf `local:`
      # plugins expect them.
      - name: Install proto codegen plugins
        run: |
          go install ./cmd/forge
          forge tools install

      - name: Verify every required tool resolves
        # Fail here, in five seconds, with the tool named — rather than 20
        # minutes in when the test that needs it does. This list must stay
        # equal to the tools requireTool asks for.
        run: |
          set -euo pipefail
          missing=()
          for tool in go node npm npx kcl golangci-lint buf protoc-gen-go protoc-gen-connect-go git; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '  ok       %-24s %s\n' "$tool" "$(command -v "$tool")"
            else
              printf '  MISSING  %s\n' "$tool"
              missing+=("$tool")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::e2e suite requires ${missing[*]} — a step above did not do its job"
            exit 1
          fi

      # ── The partition. Derived, printed, and checked. ────────────────
      - name: Assign this shard its tests
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          # -list is the same enumeration `go test` runs from, so the
          # authoritative set cannot drift from a hand-maintained one.
          go test -tags e2e -list '.*' ./internal/cli/ \
            | grep -E '^(Test|Fuzz|Example)' | sort -u > all-tests.txt
          total=$(wc -l < all-tests.txt | tr -d ' ')
          if [ "$total" -lt 50 ]; then
            echo "::error::-list found only $total tests in ./internal/cli/ — the e2e tag did not take, and a shard that enumerates nothing passes everything"
            exit 1
          fi
          awk -v n="$SHARDS" -v i="$SHARD" 'NR % n == i' all-tests.txt > shard-tests.txt
          mine=$(wc -l < shard-tests.txt | tr -d ' ')
          if [ "$mine" -eq 0 ]; then
            echo "::error::shard $SHARD of $SHARDS was assigned 0 of $total tests"
            exit 1
          fi
          echo "EXPECTED_TESTS=$mine" >> "$GITHUB_ENV"
          # LOG WHAT THIS SHARD RUNS. A shard that covers a subset without
          # saying which subset is the bug this workflow exists to fix.
          echo "::group::shard $SHARD of $SHARDS — $mine of $total tests"
          cat shard-tests.txt
          echo "::endgroup::"
          {
            echo "### shard $SHARD of $SHARDS"
            echo
            echo "Running **$mine of $total** tests. Every test is assigned to exactly one"
            echo "shard by \`NR % $SHARDS\`; the ledger job proves the union is the whole list."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # No hand-written -run. The regex is the shard's derived list,
      # anchored so a name cannot match a longer one. -json is teed to a
      # file for the ledger; the jq stage re-renders the identical `-v`
      # text to the console live, so the log reads as it would without it.
      #
      # jq runs in -R (raw line) mode with `fromjson? // {…}`: a line that is
      # not JSON — a toolchain message that escaped test2json, say — is
      # passed through verbatim instead of aborting jq mid-stream and taking
      # `go test` down with a SIGPIPE. A renderer that can hide output is not
      # a renderer this file is allowed to use.
      - name: Run this shard
        run: |
          set -euo pipefail
          RUN="^($(paste -sd'|' shard-tests.txt))$"
          go test -tags e2e -count=1 -v -timeout 60m -run "$RUN" -json ./internal/cli/ \
            | tee "e2e-shard-${{ matrix.shard }}.json" \
            | jq -R -r --unbuffered \
                '(fromjson? // {Action:"output",Output:.}) | select(.Action == "output") | .Output | sub("\n$";"")'

      # The third nail: what the shard was ASSIGNED must equal what it
      # REPORTED. A regex that silently matched nothing, or a test that
      # vanished between -list and -run, fails here instead of shrinking
      # coverage behind a green check.
      - name: This shard ran everything it was assigned
        if: always()
        run: |
          set -euo pipefail
          f="e2e-shard-${{ matrix.shard }}.json"
          # This step is always(), so it can land after the assignment step
          # itself failed. Say that plainly instead of dying on an unbound var.
          if [ -z "${EXPECTED_TESTS:-}" ]; then
            echo "::error::this shard was never assigned any tests — the assignment step did not complete"
            exit 1
          fi
          [ -s "$f" ] || { echo "::error::shard produced no test output"; exit 1; }
          ran=$(jq -R -r 'fromjson?
                  | select((.Action=="pass" or .Action=="fail" or .Action=="skip") and has("Test"))
                  | select(.Test | contains("/") | not) | .Test' "$f" | sort -u | wc -l | tr -d ' ')
          echo "assigned=$EXPECTED_TESTS ran=$ran"
          if [ "$ran" -ne "$EXPECTED_TESTS" ]; then
            echo "::error::shard ${{ matrix.shard }} was assigned $EXPECTED_TESTS tests but reported $ran. Coverage silently shrank — that is the defect this workflow exists to catch, in the workflow itself."
            comm -23 shard-tests.txt <(jq -R -r 'fromjson?
                  | select((.Action=="pass" or .Action=="fail" or .Action=="skip") and has("Test"))
                  | select(.Test | contains("/") | not) | .Test' "$f" | sort -u) | sed 's/^/  never reported: /'
            exit 1
          fi

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            e2e-shard-${{ matrix.shard }}.json
            shard-tests.txt
            all-tests.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload generated trees on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}-trees
          path: /tmp/TestE2E*
          retention-days: 7
          if-no-files-found: ignore

  ledger:
    name: coverage ledger
    runs-on: ubuntu-latest
    needs: [suite]
    # ALWAYS. The ledger's whole job is to say what did NOT run, which is
    # most valuable exactly when something went wrong.
    if: always()
    env:
      # ── The skip ratchet ─────────────────────────────────────────────
      # A test that skips is a test that did not run, and this workflow
      # exists because tests that did not run were reported as passing.
      # Every skip is named in the summary below, and the total may not
      # exceed this number. Measured today: 16 across the package.
      #
      #   11  requirePublishedForgePkg — these exercise the PUBLISHED
      #       forge/pkg path (what a real user's first `go mod tidy`
      #       resolves). The published module predates the packages the
      #       templates now import, so they cannot pass for environmental
      #       reasons until a pkg release tag is pushed
      #       (scripts/release-pkg.sh). They un-skip themselves that day.
      #    3  unconditional t.Skip: two fixture_corpus fixtures wired via
      #       the retired AppExtras path, and the retired
      #       registration-in-code service. internal/vacuousguard's
      #       dead-skip rule holds all three in its quarantine.
      #    2  untagged tests in the same package that skip on a sibling
      #       checkout / a live toolchain probe.
      #
      # THIS NUMBER MAY ONLY GO DOWN. Raising it is a decision to cover
      # less, and it has to be made in a diff someone reviews.
      FORGE_E2E_MAX_SKIPS: "16"
      EXPECTED_SHARDS: "4"
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: shards
          merge-multiple: false

      - name: Aggregate — what ran, and what did not
        run: |
          set -euo pipefail
          shopt -s nullglob

          # A shard whose artifact is missing did not run, and a summary
          # built from the shards that survived would understate the gap
          # exactly the way this workflow exists to stop.
          jsons=(shards/e2e-shard-*/e2e-shard-*.json)
          if [ "${#jsons[@]}" -ne "$EXPECTED_SHARDS" ]; then
            echo "::error::expected $EXPECTED_SHARDS shard results, found ${#jsons[@]}. A shard did not report; its tests did not run."
            {
              echo "## e2e suite coverage"
              echo
              echo "> **INCOMPLETE:** ${#jsons[@]} of $EXPECTED_SHARDS shards reported."
              echo "> The tests in the missing shard(s) did not run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cat "${jsons[@]}" > all.json
          names() {
            jq -R -r --arg a "$1" 'fromjson?
              | select(.Action == $a and has("Test"))
              | select(.Test | contains("/") | not) | .Test' all.json | sort -u
          }
          passed=$(names pass | wc -l | tr -d ' ')
          failed=$(names fail | wc -l | tr -d ' ')
          skipped_list=$(names skip)
          skipped=$(printf '%s' "$skipped_list" | grep -c . || true)

          # Totality: the union of the shards must be the whole list. Every
          # shard uploaded the same `-list` output; they must agree, and the
          # tests they collectively reported must be all of it.
          sort -u shards/e2e-shard-*/all-tests.txt > union-expected.txt
          for f in shards/e2e-shard-*/all-tests.txt; do
            if ! diff -q <(sort -u "$f") union-expected.txt >/dev/null; then
              echo "::error::shards disagree about which tests exist ($f) — they compiled different trees"
              exit 1
            fi
          done
          cat shards/e2e-shard-*/shard-tests.txt | sort -u > union-assigned.txt
          if ! diff -u union-expected.txt union-assigned.txt > partition.diff; then
            echo "::error::the shards do not partition the test list — some test is assigned to no shard"
            sed 's/^/  /' partition.diff
            exit 1
          fi
          expected_total=$(wc -l < union-expected.txt | tr -d ' ')
          reported_total=$(( passed + failed + skipped ))

          {
            echo "## e2e suite coverage"
            echo
            echo "| outcome | tests |"
            echo "| --- | --- |"
            echo "| passed | $passed |"
            echo "| failed | $failed |"
            echo "| **skipped — did NOT run** | **$skipped** |"
            echo "| total reported / enumerated | $reported_total / $expected_total |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$reported_total" -ne "$expected_total" ]; then
            echo "::error::$reported_total tests reported but $expected_total exist. Coverage shrank somewhere between enumeration and execution."
            comm -23 union-expected.txt <(names pass; names fail; names skip | sort -u) | sed 's/^/  never reported: /'
            exit 1
          fi

          if [ "$skipped" -gt 0 ]; then
            {
              echo "### Skipped — these tests did not check anything"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r test; do
              [ -n "$test" ] || continue
              reason=$(jq -R -r --arg t "$test" \
                'fromjson? | select(.Action == "output" and .Test == $t) | .Output' all.json \
                | grep -v '^=== \|^--- ' | head -n 2 | tr -d '\n' | sed 's/  */ /g')
              echo "- \`$test\` — ${reason:-no reason recorded}" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::e2e test skipped (did not run): $test — ${reason:-no reason recorded}"
            done <<< "$skipped_list"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "skipped=$skipped ceiling=$FORGE_E2E_MAX_SKIPS"
          if [ "$skipped" -gt "$FORGE_E2E_MAX_SKIPS" ]; then
            echo "::error::$skipped tests skipped, ceiling is $FORGE_E2E_MAX_SKIPS. A skip is a test that did not run. Fix the skip, or raise FORGE_E2E_MAX_SKIPS in this workflow with a reason — in a diff someone reviews."
            {
              echo "> **FAILED the skip ratchet:** $skipped skipped, ceiling $FORGE_E2E_MAX_SKIPS."
              echo "> A skip is a test that did not run. This job refuses to look greener than it is."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The shards report their own pass/fail; this makes the ledger job
      # itself red when any of them was, so a single required check covers
      # the whole lane.
      - name: Fail if any shard failed
        if: needs.suite.result != 'success'
        run: |
          echo "::error::at least one e2e shard did not succeed (result: ${{ needs.suite.result }})"
          exit 1
