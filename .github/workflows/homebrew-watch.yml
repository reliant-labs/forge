# Watches that `brew install reliant-labs/reliant/forge` hands out forge's latest
# release, from outside the tap that publishes it.
#
# The tap (reliant-labs/homebrew-reliant) publishes every release itself, with
# no human step: its update-forge-formula.yml runs on release-forge.sh's
# dispatch and every 30 minutes, and its own staleness job raises an issue
# THERE after 3 hours behind. This is the independent second alarm, in the
# repository people watch: if the tap's Actions are disabled, its deploy key
# was revoked, or its gate keeps refusing a release, this opens the issue
# "Homebrew formula is behind the latest forge release" HERE after GRACE_HOURS,
# comments once per release it falls further behind, and closes it once the
# tap catches up. A red run alone is not the signal: nobody watches scheduled
# runs (nightly.yml says the same), so the issue is.
#
# Read-only against the tap; it needs no credential beyond this repository's
# GITHUB_TOKEN (issues: write here, public reads there).
name: Homebrew watch

on:
  schedule:
    # Every 2 hours, off the top of the hour.
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: homebrew-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Tap formula is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GRACE_HOURS: "4"
      TITLE: Homebrew formula is behind the latest forge release
    steps:
      - name: Compare the tap's formula with the latest release
        run: |
          set -euo pipefail
          read -r tag published < <(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '"\(.tag_name) \(.published_at)"')
          latest="${tag#v}"
          # The formula has no version stanza: Homebrew scans it from the
          # release URLs, which all name one release.
          have="$(gh api repos/reliant-labs/homebrew-reliant/contents/Formula/forge.rb --jq .content | base64 -d |
            sed -n 's|.*/releases/download/v\([0-9][0-9.]*\)/forge_.*|\1|p' | sort -u | paste -sd, -)"
          echo "tap installs forge ${have:-nothing}; latest release $latest ($published)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"

          if [ "$have" = "$latest" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Caught up: the tap installs forge $have ($run_url)."
            fi
            exit 0
          fi

          age_h=$(( ($(date -u +%s) - $(date -u -d "$published" +%s)) / 3600 ))
          if [ "$age_h" -lt "$GRACE_HOURS" ]; then
            echo "::notice::$tag was released ${age_h}h ago; within the ${GRACE_HOURS}h the tap gets to publish it"
            exit 0
          fi

          msg="\`brew install reliant-labs/reliant/forge\` installs ${have:-nothing}, but $tag was released ${age_h}h ago.

          The tap publishes every release itself (reliant-labs/homebrew-reliant, workflow \"Update forge formula\"; README, \"Automation\"). Its runs say why it has not: https://github.com/reliant-labs/homebrew-reliant/actions/workflows/update-forge-formula.yml

          Retry: \`gh workflow run update-forge-formula.yml --repo reliant-labs/homebrew-reliant -f version=$latest\`. Found by $run_url."
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$msg"
          elif ! gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body,comments \
            --jq '([.body] + [.comments[].body]) | join("\n")' | grep -qF "but $tag was released"; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$msg"
          fi
          echo "::error::the Homebrew tap installs forge ${have:-nothing}; $tag was released ${age_h}h ago"
          exit 1
