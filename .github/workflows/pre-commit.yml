# Runs the same hooks as the local pre-commit config so CI catches
# contributors who haven't installed pre-commit locally. Hook versions
# are pinned in .pre-commit-config.yaml.
name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run on a pull request only; a run on main always
# finishes (ci.yml says why).
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # See ci.yml: unauthenticated release lookups are rate-limited
          # per runner IP, which took this very job red at "Install buf"
          # having run nothing.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # The go-imports hook shells out to a goimports BINARY and fails with
      # "goimports not installed or available in the PATH" when it is absent
      # — the runner image does not ship one, and setup-go does not add it.
      # Restored on every run, saved only from main (the last step): a PR's
      # cache is visible to nobody but that PR. ci.yml's "Build-cache note".
      - name: Restore Go build cache
        id: restore-gocache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-precommit-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-precommit-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-precommit-${{ runner.os }}-
      - name: Install goimports
        # Pinned, for the same reason ci.yml pins govulncheck and
        # go-licenses: @latest makes the job non-reproducible (a hook can
        # start reformatting on a day nobody committed anything) and lets
        # a compromised upstream release run in CI. Dependabot watches
        # this file, so bumps arrive as PRs.
        # v0.49.0 matches the golang.org/x/tools already in go.mod, so the
        # hook formats with the same version the module builds against.
        run: go install golang.org/x/tools/cmd/goimports@v0.49.0
      - uses: pre-commit/action@v3.0.1
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-gocache.outputs.cache-primary-key }}
