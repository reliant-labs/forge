# Runs the same hooks as the local pre-commit config so CI catches
# contributors who haven't installed pre-commit locally. Hook versions
# are pinned in .pre-commit-config.yaml.
name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # forge is 2 modules (root CLI + pkg/ runtime lib). The default key
          # is the root go.sum only, which misses a pkg/ dependency change —
          # and pkg/ is exactly what the release flow touches.
          cache-dependency-path: |
            go.sum
            pkg/go.sum
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
      # The go-imports hook shells out to a goimports BINARY and fails with
      # "goimports not installed or available in the PATH" when it is absent
      # — the runner image does not ship one, and setup-go does not add it.
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - uses: pre-commit/action@v3.0.1
