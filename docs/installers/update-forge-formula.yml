# SOURCE OF TRUTH for reliant-labs/homebrew-reliant/.github/workflows/update-forge-formula.yml.
#
# It lives in forge so it changes with scripts/render-homebrew-formula.sh and
# scripts/build-release-assets.sh, whose output it consumes. Copy it into the tap
# (the tap is a separate repository, so this pull request cannot install it):
#
#   gh api repos/reliant-labs/homebrew-reliant/contents/.github/workflows/update-forge-formula.yml  # check first
#   cp docs/installers/update-forge-formula.yml <tap>/.github/workflows/
#
# Triggered by scripts/release-forge.sh ("forge-release-published"), or by hand
# with a version. Opens a PR against the tap's main; like the Reliant cask PR, the
# tap's ruleset requires a human approval, so the formula bump is not self-merging.
name: Update forge formula

on:
  repository_dispatch:
    types: [forge-release-published]
  workflow_dispatch:
    inputs:
      version:
        description: "forge version to update to (e.g., 0.1.46)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          VERSION="${INPUT_VERSION:-$PAYLOAD_VERSION}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like X.Y.Z (got: '$VERSION'); prereleases are not published to Homebrew"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Render Formula/forge.rb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Fetch the renderer from the forge tag being released, so the formula
          # always matches that release's asset names.
          curl -fsSL --retry 3 -o render.sh \
            "https://raw.githubusercontent.com/reliant-labs/forge/v${VERSION}/scripts/render-homebrew-formula.sh"
          curl -fsSL --retry 3 -o checksums.txt \
            "https://github.com/reliant-labs/forge/releases/download/v${VERSION}/checksums.txt"
          mkdir -p Formula
          bash render.sh "$VERSION" checksums.txt > Formula/forge.rb
          rm render.sh checksums.txt
          cat Formula/forge.rb

      - name: Audit formula
        run: |
          brew tap reliant-labs/reliant .
          brew audit --strict --formula reliant-labs/reliant/forge || true

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="update-forge-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/forge.rb && git ls-files --error-unmatch Formula/forge.rb >/dev/null 2>&1; then
            echo "Formula/forge.rb already at ${VERSION}; nothing to do"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add Formula/forge.rb
          git commit -m "Update forge to ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create --base main \
            --title "Update forge to ${VERSION}" \
            --body "Automated update of the forge formula to ${VERSION}, rendered from the v${VERSION} release's checksums.txt by scripts/render-homebrew-formula.sh."
