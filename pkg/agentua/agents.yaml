# The AI-agent and crawler list behind pkg/agentua.
#
# Each entry: token (the product token matched in a User-Agent, case-insensitive,
# on word boundaries), name, operator, class, and ranges (the URL of the IP-range
# JSON the operator publishes, "" when it publishes none we could verify).
#
# ORDER MATTERS: Classify returns the FIRST entry whose token matches, so a more
# specific token goes above any token it contains or that its UA also carries
# (Claude-SearchBot and Claude-User above ClaudeBot, Applebot-Extended above
# Applebot, Googlebot-Image above Googlebot). TestEveryTokenMatchesOnlyItsOwnAgent
# fails an ordering that lets one entry shadow another.
#
# EVERY EDIT bumps `version` (YYYY-MM-DD.N) and the sha256 pinned in
# agentua_test.go (TestVersionBumpedWithList says both). Stored rows carry the
# version they were classified with, so a query can reclassify old rows.
#
# Classes: browser, search_crawler, ai_crawler, ai_search, ai_user, tool,
# monitor, other_bot (see the Class constants in agentua.go).
#
# Ranges URLs were each fetched on 2026-11-27 and returned the
# {"prefixes":[{"ipv4Prefix"|"ipv6Prefix":…}]} format. Operators that publish no
# such list (Anthropic, Common Crawl, ByteDance, Amazon, Meta, …) have "", so
# their agents are never Verified: the name is a claim only.
#
# Robots-only tokens: Google-Extended and Applebot-Extended are robots.txt
# product tokens that control AI-training use of content crawled by Googlebot /
# Applebot; Google never sends Google-Extended as a User-Agent. They are listed
# so robots-aware tooling shares one vocabulary; a UA naming them is a claim.
version: "2026-11-27.1"
